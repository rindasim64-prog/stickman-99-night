
name: Build Stickman 99 Nights APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: stickman-99-nights

    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android app
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.stickman.ninetynights","appName":"STICKMAN 99 NIGHTS","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Stickman-99-Nights-APK
          path: stickman-99-nights/android/app/build/outputs/apk/debug/app-debug.apk
