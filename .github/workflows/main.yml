
name: Build Stickman 99 Nights APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Android
        run: |
          echo '{"appId":"com.stickman.ninetynights","appName":"STICKMAN 99 NIGHTS","webDir":"dist"}' > capacitor.config.json
          npx cap add android

      - name: Build game
        run: npm run build

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STICKMAN-99-NIGHTS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
